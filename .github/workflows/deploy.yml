name: Streamlit CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint check
        run: |
          pip install flake8
          flake8 . || true

      - name: Test app startup
        run: |
          python -m py_compile $(git ls-files '*.py') || exit 1

      - name: Inform Streamlit auto deployment
        run: echo "✔ CI passed Streamlit Cloud will auto-deploy this version."
